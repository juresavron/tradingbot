# Planned name. Provider ownership/availability must be checked before creation.
app = "juresavron-tradingbot"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[deploy]
  # One SQLite volume and one worker: accept downtime while replacing it.
  strategy = "immediate"

[build]
  dockerfile = "Dockerfile"

[env]
  TRADINGBOT_DB = "/data/tradingbot.sqlite3"
  PYTHONUNBUFFERED = "1"
  PUBLIC_ORIGIN = "https://juresavron-tradingbot.fly.dev"

[processes]
  app = "python3 -m tradingbot serve --host 0.0.0.0 --port 8080"

[[mounts]]
  source = "tradingbot_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

    [http_service.checks.headers]
      # Internal probes must pass the application's trusted-host check.
      Host = "localhost"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["app"]
